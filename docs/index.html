<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="No Luck Left – offizieller Kontakt und Impressum.">
  <title>No Luck Left</title>
  <style>
    :root { color-scheme: dark; --bg: #0c0b0f; --panel: #171319; --line: #76532c; --gold: #e7bd6a; --text: #eee7dc; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top, #24170f, var(--bg) 58%); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: min(680px, calc(100% - 32px)); padding: 48px; text-align: center; background: #171319e8; border: 1px solid var(--line); box-shadow: 0 18px 70px #0008; }
    h1 { margin: 0 0 12px; color: var(--gold); font: 500 clamp(2.2rem, 7vw, 4rem)/1.1 Georgia, serif; }
    p { margin: 8px 0 28px; }
    a { display: inline-block; padding: 10px 18px; border: 1px solid var(--gold); border-radius: 4px; color: var(--text); text-decoration: none; }
    a:hover { background: #e7bd6a1f; }
  </style>
</head>
<body>
  <main>
    <h1>No Luck Left</h1>
    <p>Offizielle Kontaktinformationen.</p>
    <a href="impressum.html">Impressum</a>
  </main>
</body>
</html>
