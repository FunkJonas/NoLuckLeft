  <style>
    :root { color-scheme: dark; --bg: #0c0b0f; --panel: #171319; --line: #76532c; --gold: #e7bd6a; --text: #eee7dc; --muted: #b8aea1; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top, #24170f, var(--bg) 58%); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: min(760px, calc(100% - 32px)); margin: 0 auto; padding: 72px 0; }
    .panel { padding: clamp(24px, 5vw, 52px); background: #171319e8; border: 1px solid var(--line); box-shadow: 0 18px 70px #0008; }
    h1 { margin: 0 0 28px; color: var(--gold); font: 500 clamp(2.2rem, 6vw, 4rem)/1.1 Georgia, serif; }
    h2 { margin: 32px 0 8px; color: var(--gold); font: 500 1.35rem/1.2 Georgia, serif; }
    p { margin: 8px 0; }
    .placeholder { color: var(--muted); }
    a { color: var(--gold); }
    .back { display: inline-block; margin-top: 32px; padding: 9px 15px; border: 1px solid var(--gold); border-radius: 4px; color: var(--text); text-decoration: none; }
    .back:hover { background: #e7bd6a1f; }
  </style>
</head>
